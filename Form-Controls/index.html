<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>T-shirt order</title>
    <meta name="description" content="Order a t-shirt: confirm your name and email, then choose a colour and size.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <fieldset>
          <legend>Your details</legend>
          <div>
            <label for="first-name">First name:</label>
            <input type="text" id="first-name" name="first-name" autocomplete="given-name" required minlength="2" pattern=".*\S.*\S.*" title="Please enter at least 2 characters (not just spaces)">
          </div>
          <div>
            <label for="last-name">Last name:</label>
            <input type="text" id="last-name" name="last-name" autocomplete="family-name" required minlength="2" pattern=".*\S.*\S.*" title="Please enter at least 2 characters (not just spaces)">
          </div>
          <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
        </fieldset>
        <fieldset>
          <legend>Colour</legend>
          <div>
            <input type="radio" id="colour-red" name="colour" value="red" required>
            <label for="colour-red">Red</label>
          </div>
          <div>
            <input type="radio" id="colour-green" name="colour" value="green" required>
            <label for="colour-green">Green</label>
          </div>
          <div>
            <input type="radio" id="colour-blue" name="colour" value="blue" required>
            <label for="colour-blue">Blue</label>
          </div>
        </fieldset>
        <div>
          <label for="size">Size:</label>
          <select id="size" name="size" required>
            <option value="">Choose a size</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </div>
        <button type="submit">Place order</button>
      </form>
    </main>
    <footer>
      <h2>By Christian Vuye</h2>
    </footer>
  </body>
</html>
